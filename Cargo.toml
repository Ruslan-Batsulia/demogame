[package]
name = "demogame"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"
bevy_framepace = "0.22.0"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[features]
dev = ["bevy/dynamic_linking", "bevy/bevy_dev_tools"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 3
